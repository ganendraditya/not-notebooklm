services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: not-notebooklm-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: not-notebooklm-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - LLM_PROVIDER=gemini
      - DATABASE_URL=sqlite:////app/data/not_notebooklm.db
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - backend_uploads:/app/uploads
      - backend_data:/app/data
    depends_on:
      - qdrant

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: not-notebooklm-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  qdrant_storage:
  backend_uploads:
  backend_data:
